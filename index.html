<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; }
      .example-container { overflow: hidden; position: absolute; width: 100%; height: 100%; }
      
      /* Styling für den Ton-Button */
      .volume-button {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 9999;
        width: 50px;
        height: 50px;
        background: rgba(255, 193, 7, 0.8); /* Schickes Bernstein-Gelb, passend zur App */
        border: none;
        border-radius: 50%;
        color: white;
        font-size: 24px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body>
    <button id="muteBtn" class="volume-button">🔇</button>

    <div class="example-container">
      <a-scene 
        mindar-image="imageTargetSrc: symbols/targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes;" 
        embedded 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">

        <a-assets>
          <video id="buchVideo" src="videos/video1.webm" preload="auto" loop="true" playsinline webkit-playsinline muted crossOrigin="anonymous"></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="my-target" mindar-image-target="targetIndex: 0">
          <a-video src="#buchVideo" width="1" height="0.55" position="0 0 0"></a-video>
        </a-entity>
      </a-scene>
    </div>

    <script>
      const targetEntity = document.querySelector('#my-target');
      const videoElement = document.querySelector('#buchVideo');
      const muteBtn = document.querySelector('#muteBtn');

      // Tracking-Logik
      targetEntity.addEventListener("targetFound", () => {
        console.log("Target gefunden - WEBM startet");
        videoElement.play();
      });

      targetEntity.addEventListener("targetLost", () => {
        videoElement.pause();
      });

      // Ton-Schalter-Logik
      muteBtn.addEventListener("click", () => {
        if (videoElement.muted) {
          videoElement.muted = false; // Ton einschalten
          muteBtn.innerText = "🔊";    // Symbol ändern
          muteBtn.style.background = "rgba(76, 175, 80, 0.8)"; // Grün für "Ton an"
          
          // Falls das Video durch das Entmuten kurz stockt, jagen wir es direkt wieder hoch
          videoElement.play();
        } else {
          videoElement.muted = true;
          muteBtn.innerText = "🔇";
          muteBtn.style.background = "rgba(255, 193, 7, 0.8)";
        }
      });
    </script>
  </body>
</html>
