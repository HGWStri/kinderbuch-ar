<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <script>
      // Diese Komponente zwingt A-Frame, das Video JEDEN Frame neu zu zeichnen
      AFRAME.registerComponent('video-controls', {
        init: function () {
          this.toggle = false;
          this.vid = document.querySelector("#buchVideo");
          
          // Sobald das Logo gefunden wird
          this.el.addEventListener('targetFound', () => {
            console.log("Target gefunden - Video wird gestartet");
            this.vid.play();
          });

          // Wenn das Logo aus dem Bild verschwindet
          this.el.addEventListener('targetLost', () => {
            console.log("Target verloren - Video pausiert");
            this.vid.pause();
          });
        },
        // Das hier ist der Schlüssel: Es aktualisiert die Textur im Sekundentakt!
        tick: function () {
          if (!this.vid.paused) {
            this.el.getObject3D('mesh').material.map.needsUpdate = true;
          }
        }
      });
    </script>

    <style>
      body { margin: 0; overflow: hidden; }
      .example-container { overflow: hidden; position: absolute; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="example-container">
      <a-scene 
        mindar-image="imageTargetSrc: symbols/targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes;" 
        embedded 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">

        <a-assets>
          <video id="buchVideo" src="videos/seite1.mp4" preload="auto" loop="true" playsinline webkit-playsinline muted crossOrigin="anonymous"></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="my-target" mindar-image-target="targetIndex: 0" video-controls>
          <a-video src="#buchVideo" width="1" height="0.55" position="0 0 0"></a-video>
        </a-entity>
      </a-scene>
    </div>
  </body>
</html>
