<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; }
      .example-container { overflow: hidden; position: absolute; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="example-container">
      <a-scene 
        mindar-image="imageTargetSrc: symbols/targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes;" 
        embedded 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">

        <a-assets>
          <video id="buchVideo" src="videos/DEIN_VIDEO_NAME.mp4" preload="auto" loop="true" playsinline webkit-playsinline muted></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="my-target" mindar-image-target="targetIndex: 0">
          <a-video src="#buchVideo" width="1" height="0.55" position="0 0 0"></a-video>
        </a-entity>
      </a-scene>
    </div>

    <script>
      // Dieses kleine Skript steuert das Video, wenn das Bild erkannt wird
      const targetEntity = document.querySelector('#my-target');
      const videoElement = document.querySelector('#buchVideo');

      targetEntity.addEventListener("targetFound", event => {
        console.log("Logo gefunden! Video startet.");
        videoElement.play();
      });

      targetEntity.addEventListener("targetLost", event => {
        console.log("Logo verloren. Video pausiert.");
        videoElement.pause();
      });
    </script>
  </body>
</html>
